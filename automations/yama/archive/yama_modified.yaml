blueprint:
  name: YAMA Modified
  description: >
    # YAMA Modified
    # original:
    # https://gist.github.com/networkingcat/a1876d7e706e07c8bdcf974113940fb8
  domain: automation
  input:
    motion_entity:
      name: Motion Sensor
      description: Motion Sensor or a group with Motion Sensors
      selector:
        entity:
    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light
    dim_brightness:
      name: Target dim brightness (%)
      default: 25
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: '%'
    dim_transition:
      name: Time of dim transition (seconds)
      default: "00:00:10"
      selector:
        time:
    off_transition:
      name: Transition time of turning lights off (seconds)
      default: "00:00:30"
      selector:
        time:
    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected.
      default: 30
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    automation_blocker:
      name: Automation Blocker (Optional)
      description: Only run if this boolean is in desired state
      default:
      selector:
        entity:
    automation_blocker_boolean:
      name: Automation Blocker Chooser (Optional)
      description: Choose 'on' for True and 'off' for False
      default: false
      selector:
        boolean:
    no_motion_blocker:
      name: No Motion Blocker (Optional)
      description: No motion sequence is not run if this boolean is in desired state
      default:
      selector:
        entity:
    no_motion_blocker_boolean:
      name: No Motion Chooser (Optional)
      description: Choose 'on' for True and 'off' for False
      default: false
      selector:
        boolean:
    elevation_check:
      name: Sun elevation check (Optional)
      description: Angle between the sun and the horizon.
      default: none
      selector:
        number:
          min: -90
          max: 90
          unit_of_measurement: degrees
    scene_ambient:
      name: Ambient Scene (Optional)
      default: scene.none
      selector:
        entity:
          domain: scene
    time_scene_ambient_start:
      name: Ambient time frame start (Optional)
      default: "00:00:00"
      selector:
        time:
    time_scene_ambient_end:
      name: Ambient time frame end (Optional)
      default: "00:00:00"
      selector:
        time:
    scene_morning:
      name: Scene for the morning (Optional)
      default: scene.none
      selector:
        entity:
          domain: scene
    time_scene_morning:
      name: Time for the morning scene (Optional)
      default: "00:00:00"
      selector:
        time:
    scene_day:
      name: Scene for the bright day (Optional)
      default: scene.none
      selector:
        entity:
          domain: scene
    time_scene_day:
      name: Time for the day scene (Optional)
      default: "00:00:00"
      selector:
        time:
    scene_evening:
      name: Scene for the evening (Optional)
      default: scene.none
      selector:
        entity:
          domain: scene
    time_scene_evening:
      name: Time for the evening scene (Optional)
      default: "00:00:00"
      selector:
        time:
    scene_night:
      name: Scene for the dark night (Optional)
      default: scene.none
      selector:
        entity:
          domain: scene
    time_scene_night:
      name: Time for the night scene (Optional)
      default: "00:00:00"
      selector:
        time:
    scene_no_motion:
      name: Default scene for no motion (Optional)
      default: scene.none
      selector:
        entity:
          domain: scene

mode: restart
max_exceeded: silent

variables:
  scene_ambient: !input scene_ambient
  scene_morning: !input scene_morning
  scene_day: !input scene_day
  scene_evening: !input scene_evening
  scene_night: !input scene_night
  automation_blocker: !input automation_blocker
  automation_blocker_boolean: !input automation_blocker_boolean
  no_motion_blocker: !input no_motion_blocker
  no_motion_blocker_boolean: !input no_motion_blocker_boolean
  elevation_check: !input elevation_check
  scene_no_motion: !input scene_no_motion
  motion_entity: !input motion_entity

  dim_transition_input: !input dim_transition
  off_transition_input: !input off_transition
  dim_transition_seconds: >
    {% set t = strptime(dim_transition_input, '%H:%M:%S') %}
    {{ t.hour * 3600 + t.minute * 60 + t.second }}
  off_transition_seconds: >
    {% set t = strptime(off_transition_input, '%H:%M:%S') %}
    {{ t.hour * 3600 + t.minute * 60 + t.second }}

trigger:
  - platform: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"
  - platform: state
    entity_id: !input motion_entity
    from: "on"
    to: "off"
    for: !input no_motion_wait

condition:
  # Check if automation blocker exists or is in desired state
  - condition: or
    conditions:
      - "{{ automation_blocker == none }}"
      - "{{ automation_blocker_boolean and states(automation_blocker) == 'on' }}"
      - "{{ not automation_blocker_boolean and states(automation_blocker) == 'off' }}"
  # Check sun elevation
  - condition: template
    value_template: "{{ (elevation_check == none) or (state_attr('sun.sun','elevation') <= elevation_check | float(90)) }}"

action:
  - choose:
      # Trigger to state == "on"
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'on' }}"
        sequence:
          - choose:
              # Morning Scene
              - conditions:
                  - "{{ scene_morning != 'scene.none'}}"
                  - condition: time
                    after: !input time_scene_morning
                    before: !input time_scene_day
                sequence:
                  - scene: !input scene_morning
              # Day Scene
              - conditions:
                  - "{{ scene_day != 'scene.none'}}"
                  - condition: time
                    after: !input time_scene_day
                    before: !input time_scene_evening
                sequence:
                  - scene: !input scene_day
              # Evening Scene
              - conditions:
                  - "{{ scene_evening != 'scene.none'}}"
                  - condition: time
                    after: !input time_scene_evening
                    before: !input time_scene_night
                sequence:
                  - scene: !input scene_evening
              # Night Scene
              - conditions:
                  - "{{ scene_night != 'scene.none'}}"
                  - condition: time
                    after: !input time_scene_night
                    before: !input time_scene_morning
                sequence:
                  - scene: !input scene_night
            # Default: Turn light on
            default:
              - service: light.turn_on
                target: !input light_target
      # Trigger to state == "off"
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'off' }}"
          # Check no motion blocker
          - condition: or
            conditions:
              - "{{ no_motion_blocker == none }}"
              - "{{ no_motion_blocker_boolean and states(no_motion_blocker) == 'on' }}"
              - "{{ not no_motion_blocker_boolean and states(no_motion_blocker) == 'off' }}"
        sequence:
          - choose:
              # Ambient scene
              - conditions:
                  - "{{ scene_ambient != 'scene.none' }}"
                  - condition: time
                    after: !input time_scene_ambient_start
                    before: !input time_scene_ambient_end
                sequence:
                  - scene: !input scene_ambient
              # Default no motion scene
              - conditions:
                  - "{{ scene_no_motion != 'scene.none' }}"
                sequence:
                  - scene: !input scene_no_motion
            # Default: Dim then turn off
            default:
              - choose:
                  # NIGHT scene: Turn off immediately (no dimming)
                  - conditions:
                      - "{{ scene_night != 'scene.none' }}"
                      - condition: time
                        after: !input time_scene_night
                        before: !input time_scene_morning
                    sequence:
                      - service: light.turn_off
                        target: !input light_target
                        data:
                          transition: "{{ off_transition_seconds }}"

                  # EVENING scene: Dim to 15% first
                  - conditions:
                      - "{{ scene_evening != 'scene.none' }}"
                      - condition: time
                        after: !input time_scene_evening
                        before: !input time_scene_night
                    sequence:
                      - service: light.turn_on
                        target: !input light_target
                        data:
                          brightness_pct: 15
                          transition: "{{ dim_transition_seconds }}"
                      - delay:
                          seconds: "{{ off_transition_seconds }}"
                      - service: light.turn_off
                        target: !input light_target

                  # MORNING scene: Dim to 15% first
                  - conditions:
                      - "{{ scene_morning != 'scene.none' }}"
                      - condition: time
                        after: !input time_scene_morning
                        before: !input time_scene_day
                    sequence:
                      - service: light.turn_on
                        target: !input light_target
                        data:
                          brightness_pct: 15
                          transition: "{{ dim_transition_seconds }}"
                      - delay:
                          seconds: "{{ off_transition_seconds }}"
                      - service: light.turn_off
                        target: !input light_target

                # STANDARD scene (Day): Dim to input %
                default:
                  - service: light.turn_on
                    target: !input light_target
                    data:
                      brightness_pct: !input dim_brightness
                      transition: "{{ dim_transition_seconds }}"
                  - delay:
                      seconds: "{{ off_transition_seconds }}"
                  - service: light.turn_off
                    target: !input light_target
